<script>
const P=JSON.parse(document.getElementById('payload').textContent);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='skill-atlas-k1';
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
async function openWith(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},key,ub(P.ct));
 const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
(async()=>{const raw=localStorage.getItem(KEY);if(!raw)return;try{const k=await crypto.subtle.importKey('jwk',JSON.parse(raw),{name:'AES-GCM'},false,['decrypt']);await openWith(k);}catch(e){localStorage.removeItem(KEY);}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn'),m=document.getElementById('msg');
 b.disabled=true;b.textContent='解密中…';m.textContent='';
 try{const k=await derive(document.getElementById('pw').value);
  if(document.getElementById('rem').checked){localStorage.setItem(KEY,JSON.stringify(await crypto.subtle.exportKey('jwk',k)));}
  await openWith(k);}catch(err){m.textContent='密碼不正確';b.disabled=false;b.textContent='開啟';}
});
</script></body></html>
